<figure class="viz glass">
  <figcaption class="viz__cap"><strong>This is an evolutionary algorithm, not a leaderboard.</strong> We do not train many models and keep the best. Each generation is bred from the last. The strongest candidates are selected as parents, their settings are combined to make children, small random changes are introduced, and the children are scored on your own scans. Settings that work together survive together.</figcaption>

      <rect x="276" y="148" width="140" height="44" rx="12"/><text x="346" y="167">2. Select</text><text class="el__sub" x="346" y="183">the strongest as parents</text>
