{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ALBA AI LABS{% endblock %}</title>
  <meta name="description" content="{% block description %}ALBA AI LABS develops proprietary AI systems and evolutionary algorithms that adapt to each client's data, workflows, and industry.{% endblock %}">
  <link rel="icon" type="image/svg+xml" href="{% static 'img/logo-mark.svg' %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
  {% block head %}{% endblock %}
</head>
<body>
  {% block content %}{% endblock %}
  <script src="{% static 'js/main.js' %}" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
